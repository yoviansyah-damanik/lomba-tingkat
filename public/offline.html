<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus (Mode Offline) — LT III 2026</title>
    <meta name="theme-color" content="#d97706">
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #fafafa;
            color: #18181b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
        }
        .icon-wrapper {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: #fef3c7;
            color: #d97706;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            color: #18181b;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            line-height: 1.6;
            color: #71717a;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #f4f4f5;
            color: #52525b;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #d97706;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background: #b45309;
        }
        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #a1a1aa;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrapper">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
        </div>

        <span class="badge">Mode Luar Jaringan (Offline)</span>

        <h1>Koneksi Internet Terputus</h1>
        
        <p>
            Aplikasi LT III mendeteksi hilangnya jaringan internet di area perkemahan. Halaman yang telah tersimpan dalam cache perangkat tetap dapat Anda tinjau.
        </p>

        <button class="btn" onclick="window.location.reload()">
            <svg style="width:16px;height:16px" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Coba Hubungkan Kembali
        </button>

        <div class="footer-note">
            Lomba Tingkat III Kwarcab Gerakan Pramuka Kota Padangsidimpuan 2026
        </div>
    </div>
</body>
</html>
